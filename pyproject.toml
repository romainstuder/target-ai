[project]
name = "target-ai"
version = "0.2"
description = "AI-powered drug target validation using the Open Targets Platform"
requires-python = ">=3.14"
# open_targets_client.py uses only the standard library.
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "ruff>=0.15.16",
]

[tool.ruff]
target-version = "py314"
include = ["*.py", "*.pyi"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
